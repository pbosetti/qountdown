title: Qountdown
author: Paolo Bosetti
version: 1.0.0
quarto-required: ">=1.3.0"
contributes:
  revealjs-plugins:
    - name: RevealQountdown
      script:
        - qountdown.js
      stylesheet:
        - qountdown.css
      config:
        qountdown:
          minutes: 20
          start: fullscreen
